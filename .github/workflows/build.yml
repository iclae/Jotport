name: Intel macOS test build
on:
  push:
    branches: ['codex/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: swift test
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test core and compile AppKit
        timeout-minutes: 5
        run: JOTPORT_UI_EVIDENCE="$PWD/dist" swift test --arch x86_64
      - name: Package macOS 12 Intel app
        run: bash scripts/package.sh
      - name: Launch smoke test
        run: |
          open dist/Jotport.app
          for i in $(seq 1 20); do
            if pgrep -x Jotport; then
              sleep 3
              pgrep -x Jotport
              screencapture -x dist/smoke.png
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jotport-macOS12-Intel
          path: |
            dist/*.zip
            dist/*.txt
            dist/*.md
            dist/*.png
            dist/SHA256SUMS
          retention-days: 30
